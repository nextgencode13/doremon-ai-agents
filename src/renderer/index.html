<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doraemon AI Agents</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #F0F8FF; color: #1A1320;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 60px; height: 60px;
        background: #1C86EE; color: #FFFFFF; border: 4px solid #0056B3;
        border-radius: 12px;
        font-family: "Press Start 2P", monospace; font-size: 16px; letter-spacing: -1px;
        box-shadow: 4px 4px 0 rgba(26,19,32,0.25);
      }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 14px; color: #0A369D; }
      #cth-splash .hint { font-size: 14px; color: #4A709C; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">4D</div>
        <div class="title">DORAEMON AI AGENTS</div>
        <div class="hint">opening the 4D pocket…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
